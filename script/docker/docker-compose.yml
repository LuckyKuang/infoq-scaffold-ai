x-infoq-sql-baseline: sql/infoq_scaffold_2.0.0.sql

services:
  mysql:
    image: mysql:8.0.42
    container_name: mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting mysql}
      MYSQL_DATABASE: infoq
    ports:
      - "3306:3306"
    volumes:
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/mysql/data/:/var/lib/mysql/
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/mysql/conf/:/etc/mysql/conf.d/
      - ../../sql:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.2.8
    container_name: redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting redis}
    ports:
      - "6379:6379"
    volumes:
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/redis/conf:/redis/config:rw
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/redis/data:/redis/data:rw
      # redis image declares VOLUME /data; bind it to avoid anonymous volumes.
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/redis/data:/data:rw
    command: redis-server /redis/config/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q '^PONG$'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    container_name: minio
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER before starting minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before starting minio}
      MINIO_BROWSER_REDIRECT_URL: ${INFOQ_PUBLIC_BASE_URL:?Set INFOQ_PUBLIC_BASE_URL before starting minio}/console-oss/
      MINIO_SERVER_URL: ${INFOQ_PUBLIC_BASE_URL:?Set INFOQ_PUBLIC_BASE_URL before starting minio}/oss/
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/minio/data:/data
    command: server /data --console-address ":9001"

  infoq-admin:
    build:
      context: ../../infoq-scaffold-backend
      dockerfile: infoq-admin/Dockerfile
    image: infoq/infoq-admin:2.1.9
    container_name: infoq-admin
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 9090
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/infoq/server/config/
      DEPLOY_ID: ${DEPLOY_ID:-}
      SECURITY_TOKEN_SECRET: ${SECURITY_TOKEN_SECRET:?Set SECURITY_TOKEN_SECRET before starting infoq-admin}
      INFOQ_DB_USERNAME: ${INFOQ_DB_USERNAME:?Set INFOQ_DB_USERNAME before starting infoq-admin}
      INFOQ_DB_PASSWORD: ${INFOQ_DB_PASSWORD:?Set INFOQ_DB_PASSWORD before starting infoq-admin}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting infoq-admin}
      INFOQ_IP2REGION_V6_PATH: /infoq/server/ip2region/ip2region_v6.xdb
      JAVA_OPTS: -Xms512m -Xmx1024m
    ports:
      - "9090:9090"
    volumes:
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/server/config/:/infoq/server/config/
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/server/logs/:/infoq/server/logs/
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/server/ip2region/:/infoq/server/ip2region/:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT:-9090}; printf \"GET /monitor/health/readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  infoq-frontend-vue:
    build:
      context: ../../infoq-scaffold-frontend-vue
      dockerfile: Dockerfile
      args:
        VITE_APP_CONTEXT_PATH: ${INFOQ_VUE_CONTEXT_PATH:-/vue/}
        VITE_APP_BASE_API: /prod-api
        VITE_APP_PORT: 9091
    image: infoq/infoq-frontend-vue:2.1.9
    container_name: infoq-frontend-vue
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NGINX_PORT: 9091
    ports:
      - "9091:9091"
    volumes:
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/vue/logs/:/var/log/nginx/

  infoq-frontend-react:
    build:
      context: ../../infoq-scaffold-frontend-react
      dockerfile: Dockerfile
      args:
        VITE_APP_CONTEXT_PATH: ${INFOQ_REACT_CONTEXT_PATH:-/react/}
        VITE_APP_BASE_API: /prod-api
        VITE_APP_PORT: 9092
    image: infoq/infoq-frontend-react:2.1.9
    container_name: infoq-frontend-react
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NGINX_PORT: 9092
    ports:
      - "9092:9092"
    volumes:
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/react/logs/:/var/log/nginx/

  infoq-frontend-react-pro:
    build:
      context: ../../infoq-scaffold-frontend-react-pro
      dockerfile: Dockerfile
      args:
        VITE_APP_CONTEXT_PATH: ${INFOQ_REACT_PRO_CONTEXT_PATH:-/react-pro/}
        VITE_APP_BASE_API: /prod-api
        VITE_APP_PORT: 9093
    image: infoq/infoq-frontend-react-pro:2.1.9
    container_name: infoq-frontend-react-pro
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NGINX_PORT: 9093
    ports:
      - "9093:9093"
    volumes:
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/react-pro/logs/:/var/log/nginx/

  nginx-web:
    image: nginx:1.30.3
    container_name: nginx-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/nginx/cert:/etc/nginx/cert
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${INFOQ_DEPLOY_ROOT:-/infoq}/nginx/log:/var/log/nginx
    depends_on:
      - infoq-admin
      - minio
      - infoq-frontend-vue
      - infoq-frontend-react
      - infoq-frontend-react-pro
