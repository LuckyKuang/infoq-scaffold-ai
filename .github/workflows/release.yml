name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  verify:
    name: Verify and package backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check release version
        run: node tools/check_release_version.mjs --tag "${GITHUB_REF_NAME}"

      - name: Run backend tests and package
        run: node tools/backend_mvn.mjs -- -B -ntp -DskipTests=false clean package -P prod

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/infoq-admin/target/infoq-admin.jar
          if-no-files-found: error
          retention-days: 7

  package-admin:
    name: Package ${{ matrix.name }} admin
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    # Repository maintainers must protect this environment and supply controlled
    # four-direction RSA configuration; fixture keys are never Release inputs.
    environment: production-build
    env:
      INFOQ_PRODUCTION_CONFIG_FILE: ${{ github.workspace }}/tmp/release-config/production.env
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vue
            workspace: frontend-vue
          - name: react
            workspace: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Materialize controlled production configuration
        env:
          INFOQ_RELEASE_CONFIG: ${{ secrets.FRONTEND_PRODUCTION_CONFIG }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const content = process.env.INFOQ_RELEASE_CONFIG;
          if (!content?.trim()) throw new Error('production-build requires FRONTEND_PRODUCTION_CONFIG; sample or fixture keys cannot produce Release assets');
          const file = process.env.INFOQ_PRODUCTION_CONFIG_FILE;
          fs.mkdirSync(path.dirname(file), {recursive: true, mode: 0o700});
          fs.writeFileSync(file, content, {encoding: 'utf8', mode: 0o600, flag: 'wx'});
          NODE
          node tools/production_config.mjs check --scope frontend

      - name: Build production bundle
        working-directory: ${{ matrix.workspace }}
        run: pnpm run build:prod

      - name: Verify deployable bundle and key provenance
        run: node tools/production_config.mjs check-artifact --dir "${{ matrix.workspace }}/dist"

      - name: Package dist
        run: tar -czf "${{ matrix.name }}-dist.tar.gz" -C "${{ matrix.workspace }}/dist" .

      - name: Upload admin bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-dist
          path: ${{ matrix.name }}-dist.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Remove controlled configuration
        if: always()
        run: node --input-type=module -e 'import fs from "node:fs"; fs.rmSync(process.env.INFOQ_PRODUCTION_CONFIG_FILE, {force:true});'

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - verify
      - package-admin
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Download backend asset
        uses: actions/download-artifact@v5
        with:
          name: backend-jar
          path: release-assets/backend-jar

      - name: Download Vue asset
        uses: actions/download-artifact@v5
        with:
          name: vue-dist
          path: release-assets/vue-dist

      - name: Download React asset
        uses: actions/download-artifact@v5
        with:
          name: react-dist
          path: release-assets/react-dist

      - name: Verify release assets
        run: node skills/release-cli/scripts/verify_release_assets.mjs release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/backend-jar/infoq-admin.jar
            release-assets/vue-dist/vue-dist.tar.gz
            release-assets/react-dist/react-dist.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
