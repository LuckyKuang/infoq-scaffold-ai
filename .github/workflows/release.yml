name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  verify:
    name: Verify and package backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.policy.outputs.version }}
      channel: ${{ steps.policy.outputs.channel }}
      artifact_policy: ${{ steps.policy.outputs.artifact_policy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check release version
        run: node tools/check_release_version.mjs --tag "${GITHUB_REF_NAME}"

      - name: Classify release channel
        id: policy
        run: node skills/release-cli/scripts/release_policy.mjs classify --tag "${GITHUB_REF_NAME}" --github-output "${GITHUB_OUTPUT}"

      - name: Setup pinned Maven
        run: node tools/setup_ci_maven.mjs

      - name: Verify Maven environment
        run: node tools/backend_mvn.mjs --dry-run -- -B -ntp -DskipTests=false clean package -P prod

      - name: Run complete backend unit suite
        run: node tools/backend_mvn.mjs -- -B -ntp -DskipTests=false clean test -P dev

      - name: Verify production configuration and package
        run: node tools/backend_mvn.mjs -- -B -ntp -DskipTests=false clean package -P prod

      - name: Upload backend jar
        if: steps.policy.outputs.artifact_policy == 'compiled'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/infoq-admin/target/infoq-admin.jar
          if-no-files-found: error
          retention-days: 7

  package-admin:
    name: Package ${{ matrix.name }} admin
    runs-on: ubuntu-latest
    needs: verify
    if: needs.verify.outputs.artifact_policy == 'compiled'
    timeout-minutes: 30
    # Repository maintainers must protect this environment and supply controlled
    # four-direction RSA configuration; fixture keys are never Release inputs.
    environment: production-build
    env:
      INFOQ_PRODUCTION_CONFIG_FILE: ${{ github.workspace }}/tmp/release-config/production.env
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vue
            workspace: frontend-vue
          - name: react
            workspace: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Materialize controlled production configuration
        env:
          INFOQ_RELEASE_CONFIG: ${{ secrets.FRONTEND_PRODUCTION_CONFIG }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const content = process.env.INFOQ_RELEASE_CONFIG;
          if (!content?.trim()) throw new Error('production-build requires FRONTEND_PRODUCTION_CONFIG; sample or fixture keys cannot produce Release assets');
          const file = process.env.INFOQ_PRODUCTION_CONFIG_FILE;
          fs.mkdirSync(path.dirname(file), {recursive: true, mode: 0o700});
          fs.writeFileSync(file, content, {encoding: 'utf8', mode: 0o600, flag: 'wx'});
          NODE
          node tools/production_config.mjs check --scope frontend

      - name: Build production bundle
        working-directory: ${{ matrix.workspace }}
        run: pnpm run build:prod

      - name: Verify deployable bundle and key provenance
        run: node tools/production_config.mjs check-artifact --dir "${{ matrix.workspace }}/dist"

      - name: Package dist
        run: |
          mkdir -p tmp/release-bundles
          tar -czf "tmp/release-bundles/${{ matrix.name }}-dist.tar.gz" -C "${{ matrix.workspace }}/dist" .

      - name: Upload admin bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-dist
          path: tmp/release-bundles/${{ matrix.name }}-dist.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Remove controlled configuration
        if: always()
        run: node --input-type=module -e 'import fs from "node:fs"; fs.rmSync(process.env.INFOQ_PRODUCTION_CONFIG_FILE, {force:true});'

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - verify
      - package-admin
    if: >-
      ${{ always() && !cancelled() && needs.verify.result == 'success' &&
      ((needs.verify.outputs.artifact_policy == 'source-only' && needs.package-admin.result == 'skipped') ||
      (needs.verify.outputs.artifact_policy == 'compiled' && needs.package-admin.result == 'success')) }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Verify upstream job results
        env:
          INFOQ_VERIFY_RESULT: ${{ needs.verify.result }}
          INFOQ_ADMIN_RESULT: ${{ needs.package-admin.result }}
        run: node skills/release-cli/scripts/release_policy.mjs gate --tag "${GITHUB_REF_NAME}" --verify-result "${INFOQ_VERIFY_RESULT}" --admin-result "${INFOQ_ADMIN_RESULT}"

      - name: Prepare asset directory
        run: node --input-type=module -e 'import fs from "node:fs"; fs.mkdirSync("tmp/release-assets", {recursive:true});'

      - name: Download backend asset
        if: needs.verify.outputs.artifact_policy == 'compiled'
        uses: actions/download-artifact@v5
        with:
          name: backend-jar
          path: tmp/release-assets/backend-jar

      - name: Download Vue asset
        if: needs.verify.outputs.artifact_policy == 'compiled'
        uses: actions/download-artifact@v5
        with:
          name: vue-dist
          path: tmp/release-assets/vue-dist

      - name: Download React asset
        if: needs.verify.outputs.artifact_policy == 'compiled'
        uses: actions/download-artifact@v5
        with:
          name: react-dist
          path: tmp/release-assets/react-dist

      - name: Verify release assets
        env:
          INFOQ_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: node skills/release-cli/scripts/verify_release_assets.mjs tmp/release-assets --version "${INFOQ_RELEASE_VERSION}"

      - name: Refuse existing release and verify merged source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFOQ_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: node skills/release-cli/scripts/release_cli.mjs publish --version "${INFOQ_RELEASE_VERSION}" --dry-run

      - name: Create source-only RC prerelease
        if: needs.verify.outputs.artifact_policy == 'source-only'
        uses: softprops/action-gh-release@v2
        with:
          body: |
            这是供部署验收的非正式 RC 预览版本，尚未判定生产就绪。此版本只提供 GitHub 自动生成的源码归档，不附加 jar 或 React/Vue dist，也不发布镜像。

            请从本 tag 构建，按 deploy/DOCKER.md 与 docs/RELEASING.md 注入部署者独立受控的配置和凭据；生产基线为 Linux Docker，构建前运行 tools/production_config.mjs 预检。浏览器协议密钥不能替代 HTTPS，禁止使用示例或隔离测试密钥部署生产。

            已完成的隔离流程不替代真实凭据、公网 TLS、外部 Provider、告警接收、容量及业务 RTO/RPO 验收。正式版须等待部署验证及单独发布决策；发现问题时保留本 tag，使用后续 RC 修复，应用/数据恢复按已验证的回滚与备份方案执行。
          generate_release_notes: true
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stable release
        if: needs.verify.outputs.artifact_policy == 'compiled'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tmp/release-assets/backend-jar/infoq-admin.jar
            tmp/release-assets/vue-dist/vue-dist.tar.gz
            tmp/release-assets/react-dist/react-dist.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release metadata and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFOQ_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: node skills/release-cli/scripts/release_cli.mjs verify --version "${INFOQ_RELEASE_VERSION}"
