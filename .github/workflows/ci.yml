name: CI Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PNPM_VERSION: 10.34.1

jobs:
  encoding:
    name: UTF-8 Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Validate UTF-8
        run: node .codex/scripts/validate_utf8.mjs

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: encoding
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve Maven environment
        run: node .codex/scripts/backend_mvn.mjs --dry-run -- -B -ntp -DskipTests=false clean package -P dev

      - name: Build backend
        run: node .codex/scripts/backend_mvn.mjs -- -B -ntp -DskipTests=false clean package -P dev

  admin-frontend:
    name: Admin Frontend (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: encoding
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: react
            workspace: infoq-scaffold-frontend-react
            checks: |
              pnpm run test
              pnpm run lint
              pnpm run build:prod
          - name: react-pro
            workspace: infoq-scaffold-frontend-react-pro
            checks: |
              pnpm run test
              pnpm run lint
              pnpm run build
          - name: vue
            workspace: infoq-scaffold-frontend-vue
            checks: |
              pnpm run test:unit
              pnpm run lint:eslint
              pnpm run build:prod
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Run checks
        working-directory: ${{ matrix.workspace }}
        run: |
          ${{ matrix.checks }}

  weapp-frontend:
    name: Weapp Frontend (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: encoding
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: react
            workspace: infoq-scaffold-frontend-weapp-react
            checks: |
              pnpm run test
              pnpm run lint
              pnpm run build:weapp:dev
          - name: vue
            workspace: infoq-scaffold-frontend-weapp-vue
            checks: |
              pnpm run typecheck
              pnpm run test
              pnpm run build:weapp:dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Run checks
        working-directory: ${{ matrix.workspace }}
        run: |
          ${{ matrix.checks }}

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    needs: encoding
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: infoq-scaffold-docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: infoq-scaffold-docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: infoq-scaffold-docs
        run: pnpm run build
