name: CI Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  repository-gates:
    name: Repository Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Validate UTF-8
        run: node tools/validate_utf8.mjs

      - name: Validate README structure
        run: node tools/check_readme_sync.mjs

      - name: Validate release version consistency
        run: node tools/check_release_version.mjs

      - name: Validate documentation links
        run: node tools/check_doc_links.mjs

      - name: Validate release tool contracts
        run: |
          node skills/release-cli/scripts/test_release_cli.mjs
          node skills/release-cli/scripts/test_bump_version.mjs
          node tools/test_check_release_version.mjs
          node skills/release-cli/scripts/test_release_policy.mjs
          node skills/release-cli/scripts/test_release_assets.mjs

      - name: Setup JDK 21 for installer verification
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate pinned Maven installer
        run: node tools/test_setup_ci_maven.mjs

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: repository-gates
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup pinned Maven
        run: node tools/setup_ci_maven.mjs

      - name: Verify Maven environment
        run: node tools/backend_mvn.mjs --dry-run -- -B -ntp -DskipTests=false clean package -P dev

      - name: Build backend
        run: node tools/backend_mvn.mjs -- -B -ntp -DskipTests=false clean package -P dev

      - name: Verify production configuration and package
        run: node tools/backend_mvn.mjs -- -B -ntp -DskipTests=false clean package -P prod

  node-cli-platforms:
    name: Node CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: repository-gates
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install Web testing tools
        working-directory: skills/test-cli/scripts
        run: pnpm install --frozen-lockfile
      - name: Install isolated Chromium
        working-directory: skills/test-cli/scripts
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify real DevTools protocol and owned lifecycle
        run: node skills/test-cli/scripts/test_chrome_devtools_runtime.mjs
      - name: Preserve failed DevTools fixture evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: devtools-failure-${{ matrix.os }}
          path: |
            tmp/test-cli/devtools-protocol-*/
            tmp/test-cli/browser/chrome-devtools-mcp/
          if-no-files-found: ignore
      - name: Run cross-platform operational contracts
        run: node tools/verify/test_production_ops.mjs
      - name: Run Linux acceptance plan contracts
        run: node tools/verify/test_linux_acceptance.mjs
      - name: Run release remote CLI contracts
        run: node skills/release-cli/scripts/test_release_cli.mjs
      - name: Windows PowerShell 5.1 baseline
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'PowerShell 5.1 required' }
          node tools/verify/production_ops.mjs --help
          if ($LASTEXITCODE -ne 0) { throw 'Node CLI help failed' }
          node tools/verify/linux_acceptance.mjs --run-id windows-preview
          if ($LASTEXITCODE -ne 0) { throw 'Node CLI preview failed' }
      - name: Validate production input contracts on supported POSIX hosts
        if: runner.os != 'Windows'
        run: node tools/test_production_config.mjs

  admin-frontend:
    name: Admin Frontend (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: repository-gates
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: react
            workspace: frontend-react
            checks: |
              pnpm run test
              pnpm run lint
              pnpm run build:prod
          - name: vue
            workspace: frontend-vue
            checks: |
              pnpm run test:unit
              pnpm run lint:eslint
              pnpm run build:prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Generate controlled isolated build inputs
        run: node tools/production_fixture.mjs --output-dir tmp/production-readiness/ci-${{ matrix.name }}

      - name: Verify actual frontend encryption library interoperability
        run: node tools/test_production_crypto.mjs --client ${{ matrix.name }}

      - name: Run checks
        working-directory: ${{ matrix.workspace }}
        env:
          INFOQ_PRODUCTION_CONFIG_FILE: ${{ github.workspace }}/tmp/production-readiness/ci-${{ matrix.name }}/production.env
        run: |
          ${{ matrix.checks }}

      - name: Verify actual isolated artifact keys and provenance
        run: node tools/production_config.mjs check-artifact --dir ${{ matrix.workspace }}/dist --env-file "${{ github.workspace }}/tmp/production-readiness/ci-${{ matrix.name }}/production.env" --allow-isolated
