name: CI Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  repository-gates:
    name: Repository Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Validate UTF-8
        run: node tools/validate_utf8.mjs

      - name: Validate README structure
        run: node tools/check_readme_sync.mjs

      - name: Validate release version consistency
        run: node tools/check_release_version.mjs

      - name: Validate documentation links
        run: node tools/check_doc_links.mjs

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: repository-gates
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve Maven environment
        run: node tools/backend_mvn.mjs --dry-run -- -B -ntp -DskipTests=false clean package -P dev

      - name: Build backend
        run: node tools/backend_mvn.mjs -- -B -ntp -DskipTests=false clean package -P dev

  admin-frontend:
    name: Admin Frontend (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: repository-gates
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: react
            workspace: frontend-react
            checks: |
              pnpm run test
              pnpm run lint
              pnpm run build:prod
          - name: vue
            workspace: frontend-vue
            checks: |
              pnpm run test:unit
              pnpm run lint:eslint
              pnpm run build:prod
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Run checks
        working-directory: ${{ matrix.workspace }}
        run: |
          ${{ matrix.checks }}
