# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

captcha:
  # 是否启用验证码校验
  enable: true
  # 验证码类型 math 数组计算 char 字符验证
  type: MATH
  # line 线段干扰 circle 圆圈干扰 shear 扭曲干扰
  category: CIRCLE
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    cc.infoq: @logging.level@
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: infoq-scaffold-backend
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: infoqQuartzScheduler
            instanceId: AUTO
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            useProperties: false
            misfireThreshold: 60000
            tablePrefix: QRTZ_
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: false
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 遇到未知属性时显式失败，避免静默吞掉输入错误
      fail_on_unknown_properties: true

# security配置
security:
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**
  token:
    # 密钥至少32位，本地以外环境必须注入 SECURITY_TOKEN_SECRET。
    secret: ${SECURITY_TOKEN_SECRET:dev-only-spring-security-token-secret-20260526}

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 cc.infoq.**.mapper,org.xxx.**.mapper
  mapperPackage: cc.infoq.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: cc.infoq.**.entity
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api接口加密
api-decrypt:
  # 是否开启全局接口加密
  enabled: true
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端解密私钥 
  publicKey: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJnNwrj4hi/y3CCJu868ghCG5dUj8wZK++RNlTLcXoMmdZWEQ/u02RgD5LyLAXGjLOjbMtC+/J9qofpSGTKSx/MCAwEAAQ==
  # 请求解密私钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端加密公钥 MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKoR8mX0rGKLqzcWmOzbfj64K8ZIgOdHnzkXSOVOZbFu/TJhZ7rFAN+eaGkl3C4buccQd/EjEsj9ir7ijT7h96MCAwEAAQ==
  privateKey: 

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  info:
    # 标题
    title: '标题：infoq-scaffold-backend后台管理系统_接口文档'
    # 描述
    description: '描述：后台管理系统，包含系统管理、权限管理、通知公告等核心模块。'
    # 版本
    version: '版本号: ${project.version}'
    # 作者信息
    contact:
      name: Pontus
      email: luckykuang@foxmail.com
      url: https://github.com/luckykuang/infoq-scaffold-ai
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 系统模块
      packages-to-scan: cc.infoq.system

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse

--- # OAuth 登录
oauth:
  enabled: false
  state-ttl: 10m
  ticket-ttl: 2m
  auto-register-enabled: true
  require-invite-when-invite-register-enabled: true
  frontend-callback-path: /oauth/callback
  providers:
    github:
      client-id: ${OAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_GITHUB_REDIRECT_URI:}
      scopes:
        - read:user
        - user:email
      pkce-enabled: true
    linuxdo:
      client-id: ${OAUTH_LINUXDO_CLIENT_ID:}
      client-secret: ${OAUTH_LINUXDO_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_LINUXDO_REDIRECT_URI:}
      authorize-uri: https://connect.linux.do/oauth2/authorize
      token-uri: https://connect.linux.do/oauth2/token
      user-info-uri: https://connect.linux.do/api/user
      scopes:
        - user
      pkce-enabled: true

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: false
  # 路径
  path: /resource/websocket
  # 设置访问源地址
  allowedOrigins: '*'

--- # Quartz 托管任务
infoq:
  quartz:
    # 是否启用 Quartz 托管任务能力
    enabled: true
    # 托管任务默认组名前缀，避免误处理非本系统维护的 Job
    managedGroupPrefix: MANAGED_
    bootstrap:
      # 是否在应用启动期执行任务 reconcile
      reconcile-enabled: true
      # 是否仅在生产环境启用受控保护逻辑
      production-guard-enabled: false
      # 是否记录启动期 reconcile 已执行的部署级 marker
      marker-enabled: false
      # 启动期 reconcile 执行完成后的 Redis 部署级 marker key 前缀
      marker-prefix: infoq:quartz:bootstrap:applied
      # 当前部署批次唯一标识；推荐格式为 版本号-日期-序号，例如 2.1.8-20260602120000
      # 生产环境开启受控 reconcile 时必须给同一批部署节点注入同一个 deploy-id
      deploy-id:
      # 启动期 reconcile 使用的全局分布式锁 key 前缀
      lock-key: infoq:quartz:bootstrap-reconcile
      # 获取启动期 reconcile 全局锁的等待时间，单位毫秒
      lock-acquire-timeout: 3000
      # 启动期 reconcile 全局锁过期时间，单位毫秒；-1 表示交由 redisson 自动续期
      lock-expire: -1
