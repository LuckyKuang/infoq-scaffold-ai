interface:
  display_name: "Test CLI（Web 测试）"
  short_description: "统一浏览器、管理端 E2E 与前端运行态测试入口"
  default_prompt: "使用 $test-cli 执行 Web 侧测试：playwright-cli 页面流程与 admin-route-probe、captcha_login Redis 种子验证码登录、run_admin_e2e 路由矩阵、run_admin_crud_e2e 写入型 CRUD、page-ops 页面运维门禁，以及前端单测/coverage/lint/build 与本地栈启停；遵循只读优先、目标枚举、console/pageerror 门禁、cleanup 与端口收口。后端 smoke 使用 tools/verify，数据运维见 docs/DATA-OPS.md，本机部署与容器 smoke 见 deploy-cli。"
