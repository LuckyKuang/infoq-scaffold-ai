interface:
  display_name: "Deploy CLI（本机部署）"
  short_description: "本机部署并冒烟验证 InfoQ Apple container / Docker 栈"
  default_prompt: "使用 $deploy-cli 按平台部署并验证 InfoQ-Scaffold-AI：macOS Node 入口仅用于 Apple 后端栈，Colima 完整栈按部署脚本执行，Windows 在 WSL2 内使用 Docker；核对环境与资源归属，保存 tmp/deploy-cli/state.json，保留用户部署并显式停止一次性验证自有资源。"
